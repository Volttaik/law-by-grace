<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- ── Stacked books ───────────────────────────────
       Three simple books, stacked with a slight
       left-to-right offset. No background tile so the
       mark reads cleanly on both light and dark surfaces. -->

  <!-- Bottom book -->
  <rect x="96" y="322" width="320" height="66" rx="15" fill="#2563eb"/>
  <rect x="382" y="322" width="34" height="66" rx="15" fill="#e8eefc"/>
  <rect x="382" y="322" width="17" height="66" fill="#e8eefc"/>

  <!-- Middle book -->
  <rect x="126" y="246" width="290" height="60" rx="14" fill="#3b82f6"/>
  <rect x="384" y="246" width="32" height="60" rx="14" fill="#f2f6ff"/>
  <rect x="384" y="246" width="16" height="60" fill="#f2f6ff"/>

  <!-- Top book -->
  <rect x="156" y="174" width="256" height="56" rx="13" fill="#60a5fa"/>
  <rect x="380" y="174" width="32" height="56" rx="13" fill="#ffffff"/>
  <rect x="380" y="174" width="16" height="56" fill="#ffffff"/>

  <!-- Page lines on the top book cover -->
  <g stroke="#ffffff" stroke-opacity="0.7" stroke-linecap="round" stroke-width="9">
    <line x1="188" y1="202" x2="348" y2="202"/>
    <line x1="188" y1="226" x2="318" y2="226"/>
  </g>
</svg>
